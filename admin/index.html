<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meravs admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap">
<style>
  :root{
    --bg:#070D16; --panel:#0E1725; --panel2:#132033; --line:#1E2C40; --line2:#2A3C55;
    --ink:#E9ECF1; --mute:#8494A8; --dim:#5D6B7E;
    --brass:#C9A55C; --brass-lit:#E5CB93; --ok:#5BB98B; --bad:#E0654E; --warn:#D9A441;
    --display:'Marcellus',Georgia,serif; --body:'Karla',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --r:2px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;
    -webkit-font-smoothing:antialiased}
  a{color:var(--brass)}
  ::selection{background:var(--brass);color:var(--bg)}

  /* ---------- login ---------- */
  .gate{min-height:100%;display:grid;place-items:center;padding:24px}
  .gate-card{width:min(100%,400px);border:1px solid var(--line);background:var(--panel);padding:34px 30px;
    box-shadow:0 30px 80px -40px #000}
  .gate .mark{font-family:var(--display);font-size:20px;letter-spacing:.34em;text-indent:.34em;margin:0 0 4px}
  .gate .sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:0 0 26px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
  aside{border-right:1px solid var(--line);background:var(--panel);padding:24px 0;display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh}
  aside .brand{padding:0 22px 22px;border-bottom:1px solid var(--line);margin-bottom:16px}
  aside .brand h1{font-family:var(--display);font-size:17px;letter-spacing:.3em;margin:0;font-weight:400}
  aside .brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  aside nav{display:flex;flex-direction:column}
  aside nav button{display:flex;align-items:center;gap:11px;text-align:left;background:none;border:0;cursor:pointer;
    color:var(--mute);font-family:var(--body);font-size:14px;padding:11px 22px;border-left:2px solid transparent}
  aside nav button:hover{color:var(--ink)}
  aside nav button[aria-selected="true"]{color:var(--brass);border-left-color:var(--brass);background:#0D1826}
  aside nav svg{width:16px;height:16px;flex:none;opacity:.85}
  aside .foot{margin-top:auto;padding:16px 22px 0;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);overflow-wrap:anywhere}
  aside .foot a{display:inline-block;margin-top:8px}

  main{padding:30px clamp(20px,3vw,40px) 80px;min-width:0}
  .head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
  .head h2{font-family:var(--display);font-weight:400;font-size:27px;margin:0;line-height:1.1}
  .head p{margin:5px 0 0;color:var(--mute);font-size:14px}
  section[hidden]{display:none}

  /* ---------- bits ---------- */
  .note{border:1px solid var(--line);border-left:2px solid var(--warn);background:var(--panel);padding:13px 15px;
    margin-bottom:22px;font-size:13.5px;color:var(--mute)}
  .note.ok{border-left-color:var(--ok)} .note.bad{border-left-color:var(--bad)}
  .note b{color:var(--ink)} .note code{font-family:var(--mono);font-size:12px;color:var(--brass)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px;margin-bottom:26px}
  .stat{border:1px solid var(--line);background:var(--panel);padding:16px 18px}
  .stat .n{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
  .stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px}
  .wcard{border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;padding:0;
    display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
  .wcard:hover{border-color:var(--brass);transform:translateY(-2px)}
  .wcard .art{aspect-ratio:1;display:grid;place-items:center;padding:16%;
    background:radial-gradient(circle at 50% 45%,#16233A 0%,var(--panel) 62%,#050A11 130%)}
  .wcard .art svg{width:100%;height:100%;display:block}
  .wcard .meta{padding:13px 15px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .wcard .r{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--brass)}
  .wcard .n{font-family:var(--display);font-size:17px}
  .wcard .p{font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 7px;border:1px solid;align-self:flex-start;margin-top:4px}
  .tag.in{color:var(--ok);border-color:#24533F} .tag.out{color:var(--bad);border-color:#5A2A21}

  /* ---------- editor ---------- */
  .editor{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
  @media (max-width:900px){ .editor{grid-template-columns:minmax(0,1fr)} .shell{grid-template-columns:minmax(0,1fr)}
    aside{position:static;height:auto} aside nav{flex-direction:row;overflow-x:auto} aside nav button{white-space:nowrap} }
  .preview{position:sticky;top:30px;border:1px solid var(--line);background:var(--panel);padding:22px}
  .preview .art{aspect-ratio:1;display:grid;place-items:center;padding:8%;
    background:radial-gradient(circle at 50% 45%,#16233A 0%,var(--panel) 62%,#050A11 130%)}
  .preview .art svg{width:100%;height:100%}
  .preview .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;text-align:center;margin-top:14px}

  fieldset{border:1px solid var(--line);background:var(--panel);padding:18px 20px 22px;margin:0 0 16px}
  legend{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);padding:0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:14px}
  label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  input,select,textarea{font-family:var(--body);font-size:14.5px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line2);padding:9px 11px;width:100%;min-width:0;border-radius:var(--r)}
  textarea{font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass)}
  input[type=color]{padding:3px;height:38px;cursor:pointer}
  .pwwrap{position:relative;display:block}
  .pwwrap input{padding-right:46px}
  .eye{position:absolute;right:1px;top:1px;bottom:1px;width:44px;display:grid;place-items:center;
    background:none;border:0;color:var(--dim);cursor:pointer;padding:0}
  .eye:hover,.eye:focus-visible{color:var(--brass)}
  .eye svg{width:18px;height:18px}
  .swatch{display:grid;grid-template-columns:38px minmax(0,1fr);gap:7px;align-items:center}
  .swatch input[type=text]{font-family:var(--mono);font-size:12px}

  .btn{font-family:var(--body);font-weight:600;font-size:14px;background:var(--brass);color:#0A1320;
    border:1px solid var(--brass);padding:10px 20px;cursor:pointer;border-radius:var(--r)}
  .btn:hover{background:var(--brass-lit);border-color:var(--brass-lit)}
  .btn.ghost{background:none;color:var(--ink);border-color:var(--line2);font-weight:500}
  .btn.ghost:hover{border-color:var(--brass);color:var(--brass);background:none}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
    padding:18px 0 4px;margin-top:4px}
  .msg{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  td{font-variant-numeric:tabular-nums}
  tbody tr:hover{background:var(--panel)}
  .scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
  .empty{color:var(--mute);padding:26px;text-align:center;font-size:13.5px}
  .kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 7px;border:1px solid var(--line2);color:var(--mute)}
  .kind.waitlist{color:var(--brass);border-color:#4A3C1E}
  .kind.order{color:var(--ok);border-color:#24533F}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <p class="mark">MERAVS</p>
    <p class="sub">Administration</p>
    <div class="note" id="gateNote" hidden></div>
    <form id="loginForm">
      <div style="display:flex;flex-direction:column;gap:14px">
        <label>Admin ID<input type="text" id="uid" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label>Password<span class="pwwrap">
          <input type="password" id="pw" autocomplete="current-password" required>
          <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/>
            </svg></button>
        </span></label>
        <button class="btn" type="submit" id="loginBtn" style="margin-top:4px">Sign in</button>
      </div>
    </form>
    <p class="msg" id="loginMsg" style="margin:14px 0 0;min-height:16px"></p>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div class="shell" id="shell" hidden>
  <aside>
    <div class="brand"><h1>MERAVS</h1><span>Administration</span></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="who">—</div>
      <a href="#" id="out">Sign out</a> &middot; <a href="/" target="_blank" rel="noopener">View site</a>
    </div>
  </aside>

  <main>
    <section id="v-overview">
      <div class="head"><div><h2>Overview</h2><p id="ovSub">—</p></div></div>
      <div class="stats" id="ovStats"></div>
      <div class="head" style="margin-top:8px"><div><h2 style="font-size:19px">Latest activity</h2></div></div>
      <div class="scroll"><table id="ovTable"></table></div>
    </section>

    <section id="v-watches" hidden>
      <div class="head">
        <div><h2>Watches</h2><p id="wSub">—</p></div>
        <button class="btn ghost" id="backBtn" hidden>&larr; All watches</button>
      </div>
      <div class="cards" id="wGrid"></div>
      <div id="wEditor" hidden></div>
    </section>

    <section id="v-site" hidden>
      <div class="head"><div><h2>Site settings</h2><p>Shown across the public site. The WhatsApp number drives every order button.</p></div></div>
      <fieldset><legend>Details</legend>
        <div class="grid" id="siteGrid"></div>
        <div class="bar"><button class="btn" id="saveSite">Save settings</button><span class="msg" id="siteMsg"></span></div>
      </fieldset>
    </section>

    <section id="v-activity" hidden>
      <div class="head"><div><h2>Activity</h2><p>Every tap on a WhatsApp button, with where it came from.</p></div></div>
      <div class="stats" id="acStats"></div>
      <div class="scroll"><table id="acTable"></table></div>
    </section>
  </main>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const FLAT = ['ref','gender','name','dialName','note','tone','metal','size','price','status','photo','photoAspect','sort_order'];

let W = null;             // watchshape module
let STATE = { models: [], site: {}, events: null, editing: null };

/* ================= dial renderer =================
   Ports the SVG build out of Dial.dc.html so the panel can draw a watch from
   a plain model object, with no component runtime. This is what makes the
   editor a tool rather than a form: the dial redraws as you type.          */
function dialSVG(m) {
  if (!W) return '';
  const sp = W.spec(m || {});
  const S = 96 / Math.max(sp.caseA, sp.caseB) * (sp.shape === 'round' ? 1 : 0.98);
  const X = v => (100 + v * S).toFixed(2), Y = v => (100 - v * S).toFixed(2);
  const poly = pts => 'M' + pts.map(([x, y]) => X(x) + ' ' + Y(y)).join(' L') + ' Z';
  const circ = (cx, cy, r) => { const R = (r * S).toFixed(2);
    return 'M' + (100 + cx * S - r * S).toFixed(2) + ' ' + Y(cy) + ' a' + R + ' ' + R + ' 0 1 0 ' +
      (2 * r * S).toFixed(2) + ' 0 a' + R + ' ' + R + ' 0 1 0 ' + (-2 * r * S).toFixed(2) + ' 0 Z'; };

  const dialO = W.outline(sp.dialA, sp.dialB, sp.dialN, sp.dialPinch, 120);
  const caseO = W.outline(sp.caseA, sp.caseB, sp.caseN, sp.casePinch, 120);
  const uid = 'p' + Math.abs(String(m.ref || '0').split('').reduce((a, c) => a + c.charCodeAt(0), 0));
  const D = sp.D;

  const bezelD = sp.bezel === 'round'
    ? circ(0, 0, Math.min(19.45 * sp.bezelScale, sp.caseA - 0.4))
    : poly(caseO.map(([x, y]) => [x * 0.9, y * 0.9]));

  const groups = {}, texts = [];
  const add = (d, fill, stroke, sw, op) => {
    const k = [fill, stroke, sw, op].join('|');
    (groups[k] = groups[k] || { d: '', fill: fill || 'none', stroke: stroke || 'none',
      sw: ((sw || 0) * S).toFixed(2), op: op ?? 1 }).d += d;
  };
  sp.prims.forEach(p => {
    if (p.t === 'bar') add(poly(W.barPoly(p)), p.fill, p.stroke, p.sw, p.op);
    else if (p.t === 'poly') add(poly(p.pts), p.fill, p.stroke, p.sw, p.op);
    else if (p.t === 'dot') add(circ(p.x, p.y, p.r), p.fill, p.stroke, p.sw, p.op);
    else if (p.t === 'ring') add(poly(dialO.map(([x, y]) => [x * p.f, y * p.f])), p.fill, p.stroke, p.sw, p.op);
    else if (p.t === 'text') texts.push(
      `<text x="${X(p.x)}" y="${Y(p.y)}" style="font-family:'${p.font}',serif;font-size:${(p.size * S).toFixed(2)}px;` +
      `font-weight:${p.weight};letter-spacing:${(p.size * S * p.track).toFixed(2)}px;fill:${p.fill};` +
      `text-anchor:middle;dominant-baseline:central">${esc(p.text)}</text>`);
  });

  const pts = a => a.map(([x, y]) => X(x) + ',' + Y(y)).join(' ');
  const metal = W.METAL2D[sp.metal] || W.METAL2D.gold;
  const accent = W.METAL2D[sp.accent] || metal;
  const hand = W.METAL2D[sp.hand] || metal;
  const v = sp.stripes === 'v';

  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(m.name || 'dial')}" style="overflow:visible">
    <defs>
      <radialGradient id="g${uid}" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="${D.d0}"/><stop offset="60%" stop-color="${D.d1}"/><stop offset="100%" stop-color="${D.d2}"/>
      </radialGradient>
      <linearGradient id="h${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff" stop-opacity=".55"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".3"/>
      </linearGradient>
      <pattern id="s${uid}" width="${v ? 1.5 : 200}" height="${v ? 200 : 1.7}" patternUnits="userSpaceOnUse">
        <rect width="${v ? 0.55 : 200}" height="${v ? 200 : 0.6}" fill="rgba(0,0,0,.08)"/></pattern>
    </defs>
    <path d="${sp.shape === 'round' ? circ(0, 0, sp.caseA) : poly(caseO)}" fill="${metal}"/>
    <path d="${sp.shape === 'round' ? circ(0, 0, sp.caseA) : poly(caseO)}" fill="url(#h${uid})"/>
    <path d="${bezelD}" fill="${accent}"/><path d="${bezelD}" fill="url(#h${uid})" opacity=".8"/>
    <path d="${poly(dialO)}" fill="url(#g${uid})" stroke="rgba(0,0,0,.3)" stroke-width=".8"/>
    ${sp.stripes ? `<path d="${poly(dialO)}" fill="url(#s${uid})"/>` : ''}
    ${Object.values(groups).map(g => `<path d="${g.d}" fill="${g.fill}" stroke="${g.stroke}" stroke-width="${g.sw}" opacity="${g.op}"/>`).join('')}
    ${texts.join('')}
    <g style="transform-origin:100px 100px;transform:rotate(305deg)"><polygon points="${pts(sp.hands.hour)}" fill="${hand}"/></g>
    <g style="transform-origin:100px 100px;transform:rotate(60deg)"><polygon points="${pts(sp.hands.min)}" fill="${hand}"/></g>
    ${sp.seconds ? `<g style="transform-origin:100px 100px;transform:rotate(180deg)"><polygon points="${pts(sp.hands.sec)}" fill="${sp.secColor}"/></g>` : ''}
    <circle cx="100" cy="100" r="${((sp.handStyle === 'slim' ? 0.7 : 1.25) * S).toFixed(2)}" fill="${hand}"/>
  </svg>`;
}

/* ================= auth ================= */
async function boot() {
  let d;
  try { d = await (await fetch('/api/login')).json(); }
  catch (e) { $('#gate').hidden = false; note('#gateNote', 'bad', '<b>Cannot reach the API.</b> ' + esc(e.message)); return; }

  if (!d.admin) {
    $('#gate').hidden = false;
    if (!d.passwordLoginAvailable) {
      note('#gateNote', 'bad', '<b>The server has no password set, so nothing you type here can work.</b> This is not a wrong password — there is nothing to compare against. Add <code>ADMIN_USERNAME</code>, <code>ADMIN_PASSWORD_HASH</code> and <code>SESSION_SECRET</code> as Secrets on the Pages project. <b>Then redeploy</b> — secrets only take effect on a new deployment, which is the usual reason this message is still showing after you have added them.');
      $('#loginBtn').disabled = true;
    }
    return;
  }

  $('#shell').hidden = false;
  $('#who').textContent = d.who || 'signed in';
  $('#out').onclick = async e => { e.preventDefault(); await fetch('/api/login', { method: 'DELETE' }); location.reload(); };

  try { W = await import('/watchshape.js'); } catch (_) {}
  try { await document.fonts.ready; } catch (_) {}
  buildNav();
  await Promise.all([loadInventory(), loadEvents()]);
  renderOverview();
}

function note(sel, kind, html) { const n = $(sel); n.hidden = false; n.className = 'note ' + kind; n.innerHTML = html; }

/* show / hide the password, so a typo is something you can see rather than guess at */
const EYE_OPEN = '<path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/>';
const EYE_SHUT = '<path d="M3 3l18 18M10.6 6A8.7 8.7 0 0 1 12 5.5c7 0 10.5 6.5 10.5 6.5a19 19 0 0 1-3.6 4.3M6.6 8.1A19 19 0 0 0 1.5 12S5 18.5 12 18.5a9.6 9.6 0 0 0 3.6-.7"/><path d="M9.8 9.9a3.2 3.2 0 0 0 4.4 4.4"/>';
$('#eye').onclick = () => {
  const pw = $('#pw'), on = pw.type === 'password';
  pw.type = on ? 'text' : 'password';
  $('#eye').setAttribute('aria-pressed', String(on));
  $('#eye').setAttribute('aria-label', on ? 'Hide password' : 'Show password');
  $('#eye').querySelector('svg').innerHTML = on ? EYE_SHUT : EYE_OPEN;
  pw.focus();
};

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('#loginMsg'), btn = $('#loginBtn');
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'checking…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: $('#uid').value, password: $('#pw').value }) });
    const d = await r.json();
    if (r.ok) { location.reload(); return; }
    msg.className = 'msg bad';
    msg.textContent = d.error === 'too_many_attempts' ? `Too many attempts. Wait ${d.retryAfterMinutes} minutes.`
      : d.error === 'login_not_configured' ? 'Login is not configured on the server.' : 'Wrong ID or password.';
  } catch (err) { msg.className = 'msg bad'; msg.textContent = err.message; }
  btn.disabled = false; $('#pw').value = '';
};

/* ================= nav ================= */
const ICON = {
  overview: '<path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"/>',
  watches: '<circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 1M9 6l1-3h4l1 3M9 18l1 3h4l1-3"/>',
  site: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>',
  activity: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
};
function buildNav() {
  $('#nav').innerHTML = ['overview','watches','site','activity'].map((k, i) =>
    `<button data-v="${k}" aria-selected="${i === 0}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>
      ${k[0].toUpperCase() + k.slice(1)}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
    $('#nav').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    ['overview','watches','site','activity'].forEach(k => { $('#v-' + k).hidden = k !== b.dataset.v; });
    if (b.dataset.v === 'watches') closeEditor();
  });
}

/* ================= data ================= */
async function loadInventory() {
  const r = await fetch('/api/inventory');
  if (!r.ok) return;
  const d = await r.json();
  STATE.models = d.models || []; STATE.site = d.site || {};
  renderGrid(); renderSite();
}
async function loadEvents() {
  try { const r = await fetch('/api/events?limit=300'); if (r.ok) STATE.events = await r.json(); }
  catch (_) {}
  renderActivity();
}

/* ================= overview ================= */
function renderOverview() {
  const inStock = STATE.models.filter(m => m.status !== 'out').length;
  const kinds = Object.fromEntries((STATE.events?.byKind || []).map(k => [k.kind, k.n]));
  const value = STATE.models.reduce((s, m) => s + Number(m.price || 0), 0);
  $('#ovSub').textContent = `${STATE.models.length} references · ${inStock} in stock`;
  $('#ovStats').innerHTML = [
    [STATE.models.length, 'References'], [inStock, 'In stock'],
    [kinds.waitlist || 0, 'Waitlist taps'], [kinds.order || 0, 'Order taps'],
    [inr(value), 'Catalogue value'],
  ].map(([n, k]) => `<div class="stat"><div class="n">${n}</div><div class="k">${k}</div></div>`).join('');
  $('#ovTable').innerHTML = eventRows((STATE.events?.events || []).slice(0, 12));
}

/* ================= watches ================= */
function renderGrid() {
  $('#wSub').textContent = 'Click a watch to edit it. The preview redraws as you type.';
  $('#wGrid').innerHTML = STATE.models.map(m => `
    <button class="wcard" data-ref="${esc(m.ref)}">
      <span class="art">${dialSVG(m)}</span>
      <span class="meta">
        <span class="r">REF. ${esc(m.ref)}</span>
        <span class="n">${esc(m.name)}</span>
        <span class="p">${inr(m.price)} · ${esc(m.size)}mm</span>
        <span class="tag ${m.status === 'out' ? 'out' : 'in'}">${m.status === 'out' ? 'SOLD OUT' : 'IN STOCK'}</span>
      </span></button>`).join('');
  $('#wGrid').querySelectorAll('.wcard').forEach(b => b.onclick = () => openEditor(b.dataset.ref));
}

function closeEditor() {
  STATE.editing = null;
  $('#wEditor').hidden = true; $('#wGrid').hidden = false; $('#backBtn').hidden = true;
  $('#wSub').textContent = 'Click a watch to edit it. The preview redraws as you type.';
}
$('#backBtn').onclick = closeEditor;

const F = (label, name, val, type = 'text', opts) => opts
  ? `<label>${label}<select name="${name}">${opts.map(o =>
      `<option value="${esc(o)}"${String(o) === String(val) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`
  : `<label>${label}<input name="${name}" type="${type}" value="${esc(val ?? '')}"></label>`;

const C = (label, name, val) => `<label>${label}<span class="swatch">
  <input type="color" name="${name}__c" value="${esc(val || '#000000')}">
  <input type="text" name="${name}" value="${esc(val || '')}"></span></label>`;

function openEditor(ref) {
  const m = STATE.models.find(x => x.ref === ref); if (!m) return;
  STATE.editing = JSON.parse(JSON.stringify(m));
  $('#wGrid').hidden = true; $('#wEditor').hidden = false; $('#backBtn').hidden = false;
  $('#wSub').textContent = `Editing reference ${m.ref}`;
  const d = m.dial || {};

  $('#wEditor').innerHTML = `<div class="editor">
    <div class="preview">
      <div class="art" id="pv">${dialSVG(m)}</div>
      <div class="cap">Live preview</div>
    </div>
    <form id="wForm">
      <fieldset><legend>Listing</legend><div class="grid">
        ${F('Name','name',m.name)} ${F('Price ₹','price',m.price,'number')}
        ${F('Status','status',m.status,'text',['in','out'])} ${F('For','gender',m.gender,'text',['men','women'])}
        ${F('Case size mm','size',m.size,'number')} ${F('Sort order','sort_order',STATE.models.indexOf(m) + 1,'number')}
        ${F('Dial name','dialName',m.dialName)} ${F('Note','note',m.note)}
        ${F('Tone label','tone',m.tone)} ${F('Photo file','photo',m.photo)}
        ${F('Photo aspect','photoAspect',m.photoAspect)}
      </div></fieldset>

      <fieldset><legend>Case &amp; hands</legend><div class="grid">
        ${F('Shape','shape',m.shape || 'round','text',['round','cushion','tonneau','eye'])}
        ${F('Bezel','bezel',m.bezel || 'smooth','text',['smooth','fluted'])}
        ${F('Metal','metal',m.metal,'text',['gold','steel','rose'])}
        ${F('Accent','accent',m.accent || '','text',['','gold','steel','rose'])}
        ${F('Hand colour','hand',m.hand || '','text',['','gold','steel','rose'])}
        ${F('Hand style','hands',m.hands || 'dauphine','text',['dauphine','baton','slim'])}
        ${F('Seconds hand','seconds',m.seconds === false ? 'no' : 'yes','text',['yes','no'])}
        ${C('Seconds colour','secColor',m.secColor || '#D2543F')}
      </div></fieldset>

      <fieldset><legend>Dial</legend><div class="grid">
        ${C('Centre','dial.d0',d.d0)} ${C('Mid','dial.d1',d.d1)} ${C('Edge','dial.d2',d.d2)}
        ${C('Numerals','dial.ink',d.ink)} ${C('Indices','dial.idx',d.idx)} ${C('Sunburst','dial.sheen',d.sheen)}
        ${F('Marker style','dial.numerals',d.numerals || 'roman','text',['roman','xii-vi','sticks','dots','tonneau','eye'])}
        ${F('Texture','dial.style',d.style || '','text',['','stripes','waves'])}
        ${F('Stripe direction','dial.stripeDir',d.stripeDir || 'h','text',['h','v'])}
        ${F('Wordmark font','dial.font',d.font || '','text',['','serif'])}
      </div></fieldset>

      <details><summary style="cursor:pointer;color:var(--mute);font-size:13px;margin-bottom:10px">Advanced — raw design JSON</summary>
        <textarea name="__json" rows="10">${esc(JSON.stringify(designOf(m), null, 2))}</textarea>
        <p style="color:var(--dim);font-size:12.5px">Edited here, this wins over the controls above on save.</p>
      </details>

      <div class="bar">
        <button class="btn" type="submit">Save changes</button>
        <button class="btn ghost" type="button" id="revert">Revert</button>
        <span class="msg" id="wMsg"></span>
      </div>
    </form></div>`;

  const form = $('#wForm');
  form.addEventListener('input', e => {
    // keep the colour picker and its hex box in step, then redraw
    const n = e.target.name || '';
    if (n.endsWith('__c')) { const t = form.querySelector(`[name="${n.slice(0, -3)}"]`); if (t) t.value = e.target.value; }
    else if (/^(dial\.|secColor)/.test(n) && /^#[0-9a-f]{6}$/i.test(e.target.value)) {
      const c = form.querySelector(`[name="${n}__c"]`); if (c) c.value = e.target.value;
    }
    $('#pv').innerHTML = dialSVG(collect());
  });
  $('#revert').onclick = () => openEditor(ref);
  form.onsubmit = async ev => { ev.preventDefault(); await save(collect()); };
}

const designOf = m => { const o = {}; Object.keys(m).forEach(k => { if (!FLAT.includes(k)) o[k] = m[k]; }); return o; };

function collect() {
  const form = $('#wForm'), base = STATE.editing;
  const out = { ref: base.ref, dial: { ...(base.dial || {}) } };
  form.querySelectorAll('[name]').forEach(el => {
    const n = el.name;
    if (n.endsWith('__c') || n === '__json') return;
    let v = el.value;
    if (el.type === 'number') v = Number(v);
    if (n === 'seconds') { out.seconds = v === 'yes'; return; }
    if (n.startsWith('dial.')) { const k = n.slice(5); if (v !== '') out.dial[k] = v; else delete out.dial[k]; return; }
    if (v === '' ) return;
    out[n] = v;
  });
  // carry over anything the form does not expose (bracelet, sub, ring, …)
  Object.entries(designOf(base)).forEach(([k, v]) => { if (!(k in out)) out[k] = v; });
  const raw = form.querySelector('[name="__json"]');
  if (raw && raw.value.trim()) { try { Object.assign(out, JSON.parse(raw.value)); } catch (_) {} }
  return out;
}

async function save(model) {
  const msg = $('#wMsg'); msg.className = 'msg'; msg.textContent = 'saving…';
  try {
    const r = await fetch('/api/inventory', { method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ model }) });
    const d = await r.json();
    if (!r.ok) { msg.className = 'msg bad'; msg.textContent = d.error || ('HTTP ' + r.status); return; }
    msg.className = 'msg ok'; msg.textContent = 'saved — live in about a minute';
    await loadInventory(); renderOverview();
  } catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
}

/* ================= site ================= */
const SITE_FIELDS = [['launchMonth','Launch month'],['city','City'],
  ['whatsapp','WhatsApp — digits only'],['handle','Instagram handle'],['email','Contact email']];
function renderSite() {
  $('#siteGrid').innerHTML = SITE_FIELDS.map(([k, l]) => F(l, k, STATE.site[k])).join('');
}
$('#saveSite').onclick = async () => {
  const msg = $('#siteMsg'), out = {};
  $('#siteGrid').querySelectorAll('[name]').forEach(el => { out[el.name] = el.value.trim(); });
  msg.className = 'msg'; msg.textContent = 'saving…';
  try {
    const r = await fetch('/api/inventory', { method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ site: out }) });
    const d = await r.json();
    msg.className = 'msg ' + (r.ok ? 'ok' : 'bad');
    msg.textContent = r.ok ? 'saved' : (d.error || 'HTTP ' + r.status);
    if (r.ok) loadInventory();
  } catch (e) { msg.className = 'msg bad'; msg.textContent = e.message; }
};

/* ================= activity ================= */
function eventRows(rows) {
  if (!rows.length) return `<tbody><tr><td class="empty">Nothing yet. Events appear the moment someone taps a WhatsApp button.</td></tr></tbody>`;
  return `<thead><tr><th>When (UTC)</th><th>What</th><th>Watch</th><th>Where</th><th>Came from</th></tr></thead><tbody>` +
    rows.map(e => `<tr><td>${esc(e.created_at)}</td>
      <td><span class="kind ${esc(e.kind)}">${esc(e.kind)}</span></td>
      <td>${e.ref ? 'REF. ' + esc(e.ref) : '—'}</td>
      <td>${esc([e.city, e.country].filter(Boolean).join(', ') || '—')}</td>
      <td style="max-width:280px;overflow-wrap:anywhere">${esc(e.referrer || 'direct')}</td></tr>`).join('') + '</tbody>';
}
function renderActivity() {
  const d = STATE.events;
  if (!d) { $('#acTable').innerHTML = `<tbody><tr><td class="empty">Activity is locked until you are signed in.</td></tr></tbody>`; return; }
  const k = Object.fromEntries((d.byKind || []).map(x => [x.kind, x.n]));
  $('#acStats').innerHTML = [[k.waitlist || 0,'Waitlist taps'],[k.order || 0,'Order taps'],
    [k.ask || 0,'Questions'],[d.total || 0,'All events']]
    .map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="k">${l}</div></div>`).join('');
  $('#acTable').innerHTML = eventRows(d.events || []);
}

boot();
</script>
</body>
</html>
