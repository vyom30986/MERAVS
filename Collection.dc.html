<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>The first collection - Meravs</title>
<meta name="description" content="Six references. Order any watch on WhatsApp.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..500&family=JetBrains+Mono:wght@400&family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap">
<script>try{var t=localStorage.getItem('meravs-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--ground:#E9ECF0;--ink:#101C2B;--mute:#546274;--brass:#7A6019;--brass-lit:#A8842B;--line:#C6CED8;--dial:#101C2B;--dial-rim:#2B3B4E;--dial-ink:#EFE7D4;--seconds:#D2543F;--btn-bg:#101C2B;--btn-fg:#E9ECF0;--glow:#F7F8FA;--shade:#D5DBE3;--rings:.55;--tex-op:1;--wm-op:.9;--tick-op:.9;color-scheme:light;
--display:'Marcellus',Georgia,serif;--label:'Marcellus SC',Georgia,serif;--body:'Literata',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;--script:'Pinyon Script',cursive;
--lx:.3;--ly:.2;--lang:146deg;--rule-attach:scroll;
--pad:clamp(20px,5.2vw,72px);--nav-desk:none;--nav-mob:flex;--desk-inline:none;--desk-block:none;
--stage-cols:minmax(0,1fr);--canvas-col:1;--copy-col:1;--canvas-h:100svh;--copy-pt:0px;--pin-h:260svh;--copy-row:2;--gl-h:58%;--readout-b:42%;--desk-flex:none;--mob-flex:flex;--hero-min:auto;--hero-pt:28px;--caption-top:calc(54svh + 28px);--explode-h:auto;--canvas-pos:sticky;--caption-pos:static;--dial-size:min(70vw,42svh);
--pd-cols:minmax(0,1fr);--pd-pos:relative;--pd-canvas-h:62svh;--pd-info-col:1;--pd-info-row:2;--pd-info-min:auto;--pd-dial:min(64vw,44svh);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#15070B;--ink:#F2E8DA;--mute:#B89C94;--brass:#C9A55C;--brass-lit:#E6C98E;--line:#3A1A21;--dial:#2A0E15;--dial-rim:#4C232B;--dial-ink:#EFE7D4;--seconds:#D2543F;--btn-bg:#C9A55C;--btn-fg:#15070B;--glow:#34111A;--shade:#060203;--rings:.45;--tex-op:0;--wm-op:.35;--tick-op:.5;color-scheme:dark;}}
:root[data-theme="navy"]{--ground:#080F1A;--ink:#E8E9EC;--mute:#8595A8;--brass:#C9A55C;--brass-lit:#E0C288;--line:#1E2C3D;--dial:#0E1C2E;--dial-rim:#33465C;--dial-ink:#EFE7D4;--seconds:#D2543F;--btn-bg:#C9A55C;--btn-fg:#080F1A;--glow:#12203A;--shade:#03070D;--rings:.4;--tex-op:0;--wm-op:.35;--tick-op:.5;color-scheme:dark;}
:root[data-theme="dark"]{--ground:#15070B;--ink:#F2E8DA;--mute:#B89C94;--brass:#C9A55C;--brass-lit:#E6C98E;--line:#3A1A21;--dial:#2A0E15;--dial-rim:#4C232B;--dial-ink:#EFE7D4;--seconds:#D2543F;--btn-bg:#C9A55C;--btn-fg:#15070B;--glow:#34111A;--shade:#060203;--rings:.45;--tex-op:0;--wm-op:.35;--tick-op:.5;color-scheme:dark;}
@media (min-width:900px){:root{--nav-desk:flex;--nav-mob:none;--desk-inline:inline;--desk-block:block;--stage-cols:minmax(0,5fr) minmax(0,6fr);--canvas-col:2;--canvas-h:100svh;--copy-pt:0px;--pin-h:0px;--copy-row:1;--gl-h:100%;--readout-b:0px;--desk-flex:flex;--mob-flex:none;--hero-min:100svh;--hero-pt:120px;--caption-top:38svh;--explode-h:220svh;--canvas-pos:sticky;--caption-pos:sticky;--dial-size:min(34vw,60svh);--pd-cols:minmax(0,6fr) minmax(0,5fr);--pd-pos:sticky;--pd-canvas-h:calc(100svh - 72px);--pd-info-col:2;--pd-info-row:1;--pd-info-min:calc(100svh - 72px);--pd-dial:min(32vw,56svh);}}
@media (hover:hover) and (pointer:fine){:root{--rule-attach:fixed}}
*,*::before,*::after{box-sizing:border-box}
html{overscroll-behavior-y:none}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:var(--ink)}a:hover{color:var(--brass)}
::selection{background:var(--brass);color:var(--ground)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
</style>
</helmet>
<div style="position:relative;overflow-x:clip;background:var(--ground);color:var(--ink);min-height:100vh">
  <div aria-hidden="true" style="position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120vmax 90vmax at calc(var(--lx)*100%) calc(var(--ly)*100%),var(--glow) 0%,transparent 55%),linear-gradient(180deg,transparent 40%,var(--shade) 160%)"></div>
  <dc-import name="SiteHeader" active="collection" hint-size="100%,72px"></dc-import>
  <main style="position:relative;z-index:1;padding:clamp(32px,6vw,80px) var(--pad) clamp(64px,9vw,128px)">
    <div style="display:flex;align-items:center;gap:14px;font-family:var(--label);font-size:13px;letter-spacing:.045em;color:var(--brass)">
      <span style="width:28px;height:1px;background:var(--brass);flex:none"></span>
      <span>Collection · {{ countLabel }} references</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 48px;margin:20px 0 clamp(32px,4vw,48px)">
      <h1 style="font-family:var(--display);font-weight:400;font-size:clamp(38px,5vw,72px);line-height:1.04;margin:0;max-width:14ch;text-wrap:balance">The first collection</h1>
      <p style="margin:0;max-width:40ch;font-size:16.5px;line-height:1.6;color:var(--mute);text-wrap:pretty">Order any watch on WhatsApp. We confirm the price, payment and delivery with you there.</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:clamp(32px,4vw,48px)">
      <span style="font-family:var(--label);font-size:12.5px;letter-spacing:.045em;color:var(--mute);margin-right:6px">For</span>
      <sc-for list="{{ genders }}" as="gd" hint-placeholder-count="3">
        <button onClick="{{ gd.pick }}" style="height:36px;padding:0 14px;background:{{ gd.bg }};color:{{ gd.fg }};border:1px solid var(--line);font-family:var(--label);font-size:12.5px;letter-spacing:.045em;cursor:pointer">{{ gd.label }}</button>
      </sc-for>
      <span aria-hidden="true" style="width:1px;height:20px;background:var(--line);margin:0 6px"></span>
      <span style="font-family:var(--label);font-size:12.5px;letter-spacing:.045em;color:var(--mute);margin-right:6px">Size</span>
      <button onClick="{{ setAll }}" style="height:36px;padding:0 14px;background:{{ allBg }};color:{{ allFg }};border:1px solid var(--line);font-family:var(--label);font-size:12.5px;letter-spacing:.045em;cursor:pointer">All</button>
      <sc-for list="{{ sizes }}" as="sz" hint-placeholder-count="4">
        <button onClick="{{ sz.pick }}" style="height:36px;padding:0 14px;background:{{ sz.bg }};color:{{ sz.fg }};border:1px solid var(--line);font-family:var(--label);font-size:12.5px;letter-spacing:.045em;cursor:pointer">{{ sz.label }}</button>
      </sc-for>
      <button onClick="{{ toggleStock }}" aria-pressed="{{ stockOnly }}" style="margin-left:auto;flex:none;white-space:nowrap;display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;background:transparent;color:var(--ink);border:1px solid var(--line);font-family:var(--label);font-size:12.5px;letter-spacing:.045em;cursor:pointer">
        <span style="width:12px;height:12px;border:1px solid var(--brass);background:{{ stockBox }}"></span>In stock only
      </button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(40px,4vw,56px) clamp(20px,3vw,40px)">
      <sc-for list="{{ models }}" as="m" hint-placeholder-count="6">
        <dc-import name="WatchCard" model="{{ m }}" hint-size="100%,520px"></dc-import>
      </sc-for>
    </div>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <p style="font-style:italic;font-size:16.5px;color:var(--mute);margin:24px 0 0">No watches match those filters.</p>
    </sc-if>
  </main>
  <dc-import name="SiteFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { all: [], size: 0, stockOnly: false, gender: '' };
  componentDidMount() { import('./inventory.js').then(inv => this.setState({ all: inv.MODELS })); }
  renderVals() {
    const { all, size, stockOnly, gender } = this.state;
    const models = all.filter(m => (!size || m.size === size) && (!stockOnly || m.status === 'in') && (!gender || m.gender === gender));
    const on = v => size === v;
    const bg = v => on(v) ? 'var(--btn-bg)' : 'transparent', fg = v => on(v) ? 'var(--btn-fg)' : 'var(--ink)';
    return {
      models, empty: all.length > 0 && models.length === 0,
      countLabel: String(all.length || 5).padStart(2, '0'),
      genders: [['', 'All'], ['men', 'Men'], ['women', 'Women']].map(([v, l]) => ({ label: l, bg: gender === v ? 'var(--btn-bg)' : 'transparent', fg: gender === v ? 'var(--btn-fg)' : 'var(--ink)', pick: () => this.setState({ gender: v }) })),
      setAll: () => this.setState({ size: 0 }), allBg: bg(0), allFg: fg(0),
      sizes: [...new Set(all.map(m => m.size))].sort((a, b) => a - b).map(v => ({ label: v + 'mm', bg: bg(v), fg: fg(v), pick: () => this.setState({ size: v }) })),
      stockOnly, toggleStock: () => this.setState(s => ({ stockOnly: !s.stockOnly })),
      stockBox: stockOnly ? 'var(--brass)' : 'transparent',
    };
  }
}
</script>
</body>
</html>
